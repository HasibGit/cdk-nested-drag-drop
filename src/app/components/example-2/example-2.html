<div>
  <div class="example-container">
    <h2>To do</h2>

    <div class="example-list" [nxtSortablejs]="todo" [config]="normalOptions">
      <div class="example-box" *ngFor="let item of todo">
        <div *ngIf="!isArray(item); else arrayView">{{ item }}</div>
        <ng-template #arrayView>
          <div class="example-container">
            <div
              class="example-list"
              [nxtSortablejs]="isArray(item) ? toArray(item) : []"
              [config]="normalOptions"
            >
              <ng-container *ngIf="isArray(item)">
                <div
                  class="example-box"
                  *ngFor="let innerItem of toArray(item)"
                >
                  <div *ngIf="!isArray(innerItem); else innerArrayView">
                    {{ innerItem }}
                  </div>
                  <ng-template #innerArrayView>
                    <div class="example-container">
                      <div
                        class="example-list"
                        [nxtSortablejs]="
                          isArray(innerItem) ? toArray(innerItem) : []
                        "
                        [config]="normalOptions"
                      >
                        <ng-container *ngIf="isArray(innerItem)">
                          <div
                            class="example-box"
                            *ngFor="let deeperItem of toArray(innerItem)"
                          >
                            <div
                              *ngIf="
                                !isArray(deeperItem);
                                else deepestArrayView
                              "
                            >
                              {{ deeperItem }}
                            </div>
                            <ng-template #deepestArrayView>
                              <div class="example-container">
                                <div
                                  class="example-list"
                                  [nxtSortablejs]="
                                    isArray(deeperItem)
                                      ? toArray(deeperItem)
                                      : []
                                  "
                                  [config]="normalOptions"
                                >
                                  <ng-container *ngIf="isArray(deeperItem)">
                                    <div
                                      class="example-box"
                                      *ngFor="
                                        let deepestItem of toArray(deeperItem)
                                      "
                                    >
                                      {{ deepestItem }}
                                    </div>
                                  </ng-container>
                                </div>
                              </div>
                            </ng-template>
                          </div>
                        </ng-container>
                      </div>
                    </div>
                  </ng-template>
                </div>
              </ng-container>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
